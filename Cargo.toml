[package]
name = "triage-scanner"
version = "0.1.0"
edition = "2024"

[profile.dev]
debug = 0

# cranelift-codegen (pulled in by yara-x's WASM support) is huge and can OOM
# the compiler at opt-level 3. Compile it unoptimized to keep memory down.
[profile.release.package.cranelift-codegen]
opt-level = 0

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
indicatif = "0.17"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
yara-x = { version = "1", default-features = false, features = [
    "constant-folding",
    "exact-atoms",
    "fast-regexp",
    "hash-module",
    "math-module",
    "pe-module",
    "elf-module",
    "macho-module",
    "string-module",
    "time-module",
] }
